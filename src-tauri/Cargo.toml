[package]
name = "puke"
version = "0.1.0"
description = "我和大模型玩扑克"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "puke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 本地持久化：SQLite（前端通过 @tauri-apps/plugin-sql 访问）
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
